name: Gold Rate Alert

on:
  schedule:
    - cron: '30 3 * * *'   # Triggers once at 9:00 AM IST daily
  workflow_dispatch:         # Manual trigger for testing

jobs:
  send-alert:
    runs-on: ubuntu-latest
    timeout-minutes: 650     # Runs for ~10.5 hours (9AM to 7:30PM IST)

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable
          google-chrome --version

      - name: Install Python dependencies
        run: |
          pip install selenium webdriver-manager requests pytz schedule

      - name: Restore cached gold rate
        uses: actions/cache@v3
        with:
          path: last_gold_rate.json
          key: gold-rate-cache

      - name: Run Gold Rate Alert
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python gold_rate.py

      - name: Save updated gold rate to cache
        uses: actions/cache@v3
        with:
          path: last_gold_rate.json
          key: gold-rate-cache
